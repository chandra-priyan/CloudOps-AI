global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "cloudops-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]

  - job_name: "cloudops-ai-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-service:8000"]
