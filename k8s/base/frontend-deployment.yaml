apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-frontend
  namespace: default
  labels:
    app: cloudops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudops-frontend
  template:
    metadata:
      labels:
        app: cloudops-frontend
    spec:
      containers:
        - name: frontend
          image: cloudops-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
