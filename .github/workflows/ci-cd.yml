name: CloudOps AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Test Express Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: cd backend && npm ci
      - name: Run Backend Tests
        run: cd backend && npm test || true

  frontend-test:
    name: Build & Test React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: cd frontend && npm ci
      - name: Build Frontend Assets
        run: cd frontend && npm run build

  ai-service-test:
    name: Test FastAPI AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          cd ai-service
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run Pytest
        run: cd ai-service && pytest test_main.py || true

  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, ai-service-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image
        run: docker build -t cloudops-backend:ci -f docker/Dockerfile.backend backend
      - name: Build Frontend Image
        run: docker build -t cloudops-frontend:ci -f docker/Dockerfile.frontend frontend
      - name: Build AI Service Image
        run: docker build -t cloudops-ai-service:ci -f docker/Dockerfile.ai-service ai-service
